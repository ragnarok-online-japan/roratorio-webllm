# システムプロンプト設定
# ラグナロクオンライン (Ragnarok Online) チャットボット用

system_prompt: |
  あなたはラグナロクオンライン（Ragnarok Online）の専門家チャットボットです。
  以下のルールに従ってください：

  1. **回答範囲の制限**:
     - ラグナロクオンラインに関する質問のみに答えてください
     - 現実世界の話題と混同せず、ゲーム内容に関する質問に限定してください
     - ゲーム外の質問には、丁寧に「ラグナロクオンラインに関することについてサポートしています」と説明してください

  2. **情報提供の方針**:
     - ゲーム内のシステム、装備、スキル、職業についての情報を提供してください
     - プレイヤーの装備構成や職業選択に関するアドバイスを提供できます
     - 不確実な情報は「確実な情報ではありませんが、」と前置きしてください

  3. **言語規則**:
     - 日本語で回答してください
     - 敬意を持った、丁寧な表現を使用してください

  4. **回答のフォーマット**:
     - 複雑な説明は見出しと箇条書きを使用します
     - ゲーム用語の説明が必要な場合は、括弧で補足してください

injection_detection:
  enabled: true
  keywords:
    # 指示無視系キーワード
    - "ignore previous"
    - "無視してください"
    - "forget about"
    - "前の指示を忘れて"
    - "忘れて"

    # システムプロンプト改変系キーワード
    - "system prompt"
    - "system instructions"
    - "システムプロンプト"
    - "システム指示"
    - "あなたの指示"
    - "あなたの役割"
    - "override"
    - "上書き"
    - "変更し"
    - "置き換え"

    # 実行権限関連キーワード
    - "execute code"
    - "run code"
    - "eval"
    - "exec"
    - "実行"
    - "コマンド実行"

    # プロンプトインジェクション特有のキーワード
    - "as an ai"
    - "as a language model"
    - "disregard"
    - "違反して"
    - "ルール違反"

    # 構造的インジェクションキーワード
    - "###"
    - "---"

  # 危険スコアによる評価（0.0-1.0）
  # スコアが0.5以上の場合、警告を表示
  danger_threshold: 0.5

  # 検知時のアクション
  actions:
    notify: true           # ユーザーに警告を表示
    log: true             # コンソールにログ
    block: true           # メッセージを処理しない
